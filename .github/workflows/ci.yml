name: CI Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (Java ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [ '17', '21' ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Run JUnit 5 Test Suite
        run: mvn test --batch-mode

      - name: Package Executable Standalone Fat JAR
        run: mvn clean package -DskipTests --batch-mode

      - name: Verify Shaded Fat JAR Exists
        run: |
          ls -lh target/realtime-chat-app-1.0-SNAPSHOT.jar
          test -f target/realtime-chat-app-1.0-SNAPSHOT.jar

      - name: Upload Build Artifact (Java 17)
        if: matrix.java-version == '17'
        uses: actions/upload-artifact@v4
        with:
          name: realtime-chat-application-jar
          path: target/realtime-chat-app-1.0-SNAPSHOT.jar
          retention-days: 30

  docker-build:
    name: Verify Docker Container Build
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: realtime-chat-server:latest
